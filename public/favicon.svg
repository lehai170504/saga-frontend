<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="100" height="100" rx="22" fill="url(#bg-grad)" />
  
  <g transform="translate(15, 15) scale(0.7)">
    <!-- Rotating Outer Traceability Ring with Nodes -->
    <circle cx="50" cy="50" r="38" stroke="white" strokeWidth="3" strokeDasharray="8 12" opacity="0.6" />
    <circle cx="88" cy="50" r="6" fill="white" />
    <circle cx="23" cy="23" r="4" fill="white" opacity="0.9" />
    <circle cx="31" cy="83" r="3.5" fill="white" opacity="0.7" />

    <!-- Slicing Pie Core (The 'SAGA' Heart) - Perfectly Centered -->
    <!-- Quadrant 1 - Top Right -->
    <path d="M 51.5 48.5 L 51.5 20.5 A 28 28 0 0 1 79.5 48.5 Z" fill="white" opacity="1" />
    <!-- Quadrant 2 - Bottom Left -->
    <path d="M 48.5 51.5 L 20.5 51.5 A 28 28 0 0 0 48.5 79.5 Z" fill="white" opacity="0.8" />
    <!-- Quadrant 3 - Bottom Right Sliver -->
    <path d="M 51.5 51.5 L 71.3 71.3 A 28 28 0 0 1 51.5 79.5 Z" fill="white" opacity="0.5" />

    <!-- Central Core Dot -->
    <circle cx="50" cy="50" r="8" fill="#F09819" />
    <circle cx="50" cy="50" r="3.5" fill="white" />
  </g>

  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop stopColor="#f97316" />
      <stop offset="1" stopColor="#f59e0b" />
    </linearGradient>
  </defs>
</svg>
